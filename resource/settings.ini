[Settings]

# Lines starting with "#" are ignored.
# If you want to gain even more FPS by sacrificing image quality, set RenderingWidth/RenderingHeight BELOW 1280x768 and set Viewport = 2

##############################################################################
# HOTKEYS                                                                    #
# Every hotkey below uses the same format, and all of them are rebindable    #
# in-game: open the mod menu, press Settings, and use the Hotkeys section -  #
# that is far easier than editing this file by hand.                         #
#                                                                            #
#   F1                a single key                                          #
#   Ctrl+Shift+P      hold modifiers while pressing the key                  #
#   Pad:5:XI0         button 5 on the first XInput pad                       #
#   Pad:12:DI:<guid>  a button on a specific DirectInput stick/hitbox        #
#   (empty)           no hotkey at all                                       #
#                                                                            #
# Key names are uppercase (C, not c). Modifiers must match exactly, so a     #
# hotkey set to "C" does not fire when you press Ctrl+C.                     #
##############################################################################

# Shows/hides the mod's main menu.
ToggleButton = F1

##############################################
# LANGUAGE:                                  #
# Controls the language used by the UI       #
# Supported values: en, es                   #
##############################################
Language = en

# Shows/hides the online info window (who is in your room, connection info).
ToggleOnlineButton = F2

# Hides/restores the game's own health bars, timer and meter.
ToggleHUDButton = F3


# Saves / reloads a training moment (positions, health, meter).
SaveStateKeybind = F5
LoadStateKeybind = F9

# Jumps back to the saved moment of a replay so you can take over from there.
LoadReplayStateKeybind = F4

#############################################################
# Unlimited playback:                                       #
# Trigger key plays your recorded sequence back on the       #
# dummy; loop key starts/stops repeating it.                 #
#############################################################
UnlimitedPlaybackTriggerKeyCode = F6
UnlimitedPlaybackLoopKeyCode = F7
UnlimitedPlaybackLoopSetupSeconds = 0.0
UnlimitedPlaybackLoopEndingSeconds = 0.0
UnlimitedPlaybackLoopRestartLabState = 0
UnlimitedPlaybackLoopRestartMode = 0

#####################################################################
# Freeze frame keybinds:                                            #
# Pause the match on a single frame, and step forward one frame at  #
# a time. Hold the step key to keep creeping forward.               #
#####################################################################
freezeFrameKeybind = C
stepFramesKeybind = V


#####################################################################
# Room link hotkeys:                                                #
# Copy puts a shareable link for the room you are in on your        #
# clipboard (any player-created room; not ranked or replay). Join    #
# opens a room link from your clipboard without needing a browser.  #
# Both need the game window focused.                                #
#####################################################################
LobbyLinkHotkeysEnabled = 1
CopyLobbyLinkKeybind = Ctrl+C
JoinLobbyLinkKeybind = Ctrl+V


##############################################
# RENDERING SETTINGS:                        #
# Set these to your game's window resolution #
##############################################
RenderingWidth = 1920
RenderingHeight = 1080

#####################################################################################################
# VIEWPORT SETTINGS:                                                                                #
# 1 = game's default choice (size varies based on computer specs, usually its around 1920x1152)     #
# 2 = sets to the sizes of RenderingWidth and RenderingHeight                                       #
# 3 = sets to 1280x768 (this was used by all the previous BlazBlue games, fixes pixelated sprites)  #
# Note: a custom texture filter will be applied if Viewport is set to 3	                            #
#####################################################################################################
Viewport = 1

#########################################
# ANTIALIASING SETTINGS:                #
# 0 = off                               #
# 4 = x4                                #
# 5 = game's default choice             #
#########################################
AntiAliasing = 5

###################################
# V-SYNC SETTINGS:                #
# 0 = off                         #
# 1 = on                          #
###################################
V-sync = 0

#########################################
# MENUSIZE SETTINGS:                    #
# Changes the size of BBCFIM's menu     #
# 1 = Small                             #
# 2 = Medium                            #
# 3 = Large                             #
# 4 = Very Large                        #
#########################################
MenuSize = 2

#########################################################################################
# NOTIFICATION SETTINGS:                                                                #
# Mainly used to notify about other BBCFIM users and their requests in online matches	#
# Notifications are always shown on top of the window                                   #
# 0 = off                                                                               #
# 1 = on                                                                                #
#########################################################################################
Notifications = 1

#########################################################################
# INITIAL HUD VISIBILITY:                                               #
# Defines whether the HUD will begin as hidden or shown	                #
# 0 = hidden                                                            #
# 1 = shown                                                             #
#########################################################################
InitialHUDVisibility = 1

#########################################################################
# CHECK UPDATES:                                                        #
# Check and notify the user if a new version of BBCFIM is available     #
# 0 = off                                                               #
# 1 = on                                                                #
#########################################################################
CheckUpdates = 1

###########################################
# DEBUG LOG SETTINGS:                     #
# Controls whether BBCFIM writes DEBUG.txt#
# 0 = off                                #
# 1 = on                                 #
###########################################
GenerateDebugLogs = 0

#########################################################################
# SHOW RANKED PROGRESS:                                                 #
# Shows an automatic ranked progress debug window while the mod menu is  #
# open in ranked character select / ranked menu states.                  #
# 0 = off                                                                #
# 1 = on                                                                 #
#########################################################################
ShowRankedProgress = 0

#########################################################################
# SHOW SQUARE COLOR PROGRESS:                                           #
# Shows an automatic network square color progress window while inside   #
# network mode.                                                         #
# 0 = off                                                               #
# 1 = on                                                                #
#########################################################################
ShowSquareColorProgress = 0

#########################################################################
# SHOW RANKED PREDICTION:                                               #
# Shows win/loss LP and rank-change predictions during ranked match      #
# confirmation when opponent leaderboard data is available.              #
# 0 = off                                                               #
# 1 = on                                                                #
#########################################################################
ShowRankedPrediction = 1

################################################################################
# RANKED PROGRESS ROW OPTIONS:                                                  #
# Persist right-click Show options for the ranked progress overlay.             #
# 0 = off                                                                       #
# 1 = on                                                                        #
################################################################################
RankedProgressShowMatches = 1
RankedProgressShowWins = 1
RankedProgressShowLosses = 0
RankedProgressShowWinrate = 1
RankedProgressShowCharacterLeaderboardPlacement = 0
RankedProgressShowGlobalLeaderboardPlacement = 0

################################################################################
# DEBUG RANKED AUTOMATION HARNESS:                                             #
# Debug-build-only helper for the ranked RE sequence                           #
# Network mode -> Ranked search results -> back -> Set Entry -> Withdraw Entry #
# Requires EnableInDevelopmentFeatures = 1                                     #
# RankedAutomationHarnessEnabled gates the feature                             #
# RankedAutomationHarnessHotkey starts/stops the run                           #
# RankedAutomationHarnessAutorun starts automatically once a safe menu is live #
# RankedAutomationHarnessQuitOnFinish closes the game after completion         #
################################################################################
RankedAutomationHarnessEnabled = 0
RankedAutomationHarnessHotkey = F8
RankedAutomationHarnessAutorun = 0
RankedAutomationHarnessQuitOnFinish = 0

#############################################################################
# CONTROLLER MANAGEMENT SETTINGS:                                           #
# Controls how BBCFIM handles controller detection and keyboard separation. #
# SwapControllerPos swaps P1 and P2 controllers                             #
#                                                                           #
# Temporarily always off at startup due to crash issues; re-enable manually #
# each session if needed.                                                   #
# AutomaticallyUpdateControllers refreshes devices when Windows reports     #
# hardware changes.                                                         #
# EnableInDevelopmentFeatures reveals unfinished controller features like   #
# Local Controller Override; keep this off for normal releases.             #
# EnableControllerHooks toggles controller hooks that can crash under        #
# Wine/Proton. If you are playing through Wine/Proton leave this at 0.       #
# ForceEnableControllerSettingHooks overrides detection and forces hooks on. #
# Only set this to 1 if you accept a high risk of crashes.                   #
#############################################################################
SwapControllerPos = 0
PrimaryKeyboardDeviceId =
EnableControllerHooks = 1
ForceEnableControllerSettingHooks = 0
IgnoredKeyboardIds =
KeyboardRenameMap =
KeyboardMappings =
AutomaticallyUpdateControllers = 1
EnableInDevelopmentFeatures = 0

#################################################################################
# DINPUT DLL CHAINING:                                                          #
# If you want to use another dinput8.dll wrapper together with BBCFIM,          #
# rename the other dll (e.g. "dinputwrapper.dll") and put the new name here     #
# Example:                                                                      #
# DinputDllWrapper = dinputwrapper.dll                                          #
#################################################################################
DinputDllWrapper = none

#############################################################################
# FOREIGN PALETTE LOADING:                                                  #
# This sets whether the toggle for loading foreign palettes will be on      #
# or off by default when you boot the game, it can still be changed as      #
# normal by acessing the states window.                                     #
#                                                                           #
# Example:                                                                  #
# 0 = off                                                                   #
# 1 = on                                                                    #
#############################################################################
LoadForeignPalettesToggleDefault = 1                     

#############################################################################
# ALLOW PALETTE DOWNLOADS:                                                   #
# Lets opponents save your visible custom palette from the match UI.          #
# This only controls the download button in compatible BBCFIM clients.        #
# 0 = off                                                                    #
# 1 = on                                                                    #
# -1 = unset (the mod asks you once in-game)                                 #
#############################################################################
AllowPaletteDownloads = -1

#################################################################################
# REPLAY DATA UPLOADING:                                                        #
# This sets whether or not your saved replays will be automatically uploaded    #
# to a database in the adress defined below. The default is a public database   #
# for all the community, but you can define your own as well instead            #
# Example:                                                                      #
# 0 = off                                                                       #
# 1 = on                                                                        #
# -1 = unset                                                                    #
#################################################################################
UploadReplayData = -1

#################################################################################
# REPLAY DATA UPLOAD DATABASE ADDRESS:                                          #
# Sets the host, endpoint and port which a POST request will be sent to upload  #
# your replay data                                                              #
# Example:                                                                      #
# UploadReplayDataHost = 50.118.225.175                                         #
# UploadReplayDataEndpoint = /upload                                            #
# UploadReplayDataPort = 5000                                                   #
#################################################################################
UploadReplayDataHost = 50.118.225.175
UploadReplayDataEndpoint = /upload
UploadReplayDataPort = 5000


# NOT YET IMPLEMENTED, HARDCODED AT THE MOMENT # 
#################################################################################
# REPLAY DATA FRONTEND URL:                                                     #
# Sets the link to a frontend for the replay upload database, all this will     #
# do is set the "uploaded replays" link in the main IM menu to go to the url	#
# defined                                                                       #
#################################################################################
#ReplayDatabaseFrontendUrl= http://50.118.225.175:2000/

#################################################################################
# FRAME HISTORY DISPLAY CONFIG:                                                 #
# Sets width, height, and spacing between the framehistory boxes.               #
# Recommended to not set manually, it is saved automatically after using        #
# the mod window in-game.                                                       #
# FrameHistoryEnabled: whether the frame history window is shown (0/1)          #
# FrameHistoryAutoReset: auto-reset bars after each idle frame (0/1)            #
#################################################################################
FrameHistoryWidth = 12.0
FrameHistoryHeight = 20.0
FrameHistorySpacing = 6.0
FrameHistoryEnabled = 0
FrameHistoryAutoReset = 1
